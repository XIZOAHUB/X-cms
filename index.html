<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AuroraCMS Pro - The ultimate GitHub-native headless CMS" />
  <meta name="theme-color" content="#0f172a" />
  
  <title>AuroraCMS</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/aurora-icon.svg" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  
  <!-- Tailwind will be injected by Vite -->
  
  <style>
    /* Critical CSS - prevents FOUC */
    html { background: #0f172a; }
    body { 
      margin: 0; 
      font-family: 'Inter', sans-serif; 
      background: #0f172a; 
      color: #e2e8f0;
      overflow-x: hidden;
    }
    #root { min-height: 100vh; }
    
    /* Loading screen */
    .aurora-loader {
      position: fixed;
      inset: 0;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    .aurora-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .aurora-loader .logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2s ease-in-out infinite;
    }
    .aurora-loader .logo svg {
      width: 32px;
      height: 32px;
      color: white;
    }
    .aurora-loader .text {
      margin-top: 16px;
      font-size: 18px;
      font-weight: 600;
      background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .aurora-loader .subtitle {
      margin-top: 8px;
      font-size: 13px;
      color: #64748b;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }
  </style>
</head>
<body>
  <!-- Loading Screen (shows until React mounts) -->
  <div class="aurora-loader" id="loader">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
      </svg>
    </div>
    <div class="text">AuroraCMS Pro</div>
    <div class="subtitle">Loading your workspace...</div>
  </div>

  <!-- React mounts here -->
  <div id="root"></div>

  <!-- Vite will inject the bundled JS here during build -->
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
